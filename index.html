<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ASCEND: The Takeover</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0c14">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0c14; --bg2:#11141f; --card:#161a28; --card2:#1d2233;
  --line:rgba(255,255,255,0.08); --text:#eef0f6; --sub:#8890a6; --sub2:#5c6580;
  --accent:#7c5cff; --accent2:#a78bfa; --green:#3ddc84; --yellow:#ffcc4d; --red:#ff5c5c;
  --rank-glow:#7d8590; --rank-glow2:#a3aab8;
  --radius:18px; --radius-sm:12px;
  --shadow:0 8px 30px rgba(0,0,0,0.35);
}
[data-theme="light"]{
  --bg:#f3f1ea; --bg2:#ffffff; --card:#ffffff; --card2:#f6f4ee;
  --line:rgba(20,20,30,0.08); --text:#191a22; --sub:#5c6072; --sub2:#8a8fa3;
  --shadow:0 8px 24px rgba(30,20,10,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  transition:background .4s ease,color .4s ease; overscroll-behavior-y:none;}
button,input,textarea,select{font-family:inherit; color:inherit;}
.app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
.scroll{flex:1; overflow-y:auto; padding:14px 14px 100px; -webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{width:0;height:0;}

/* ===== HUD HEADER ===== */
.hud{position:sticky; top:0; z-index:20; padding:16px 16px 14px; background:linear-gradient(180deg,var(--bg) 60%,transparent);
  backdrop-filter:blur(6px);}
.hud-top{display:flex; align-items:center; gap:14px;}
.rank-core{position:relative; width:74px; height:74px; flex:none; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; letter-spacing:.5px;
  background:radial-gradient(circle at 35% 30%, var(--rank-glow2), var(--rank-glow) 70%);
  box-shadow:0 0 0 3px var(--card), 0 0 24px 2px var(--rank-glow), inset 0 0 14px rgba(255,255,255,0.25);
  color:#0a0c14; transition:all .6s ease;}
.rank-core.splus{background:conic-gradient(from 0deg,#ff5c5c,#ffcc4d,#3ddc84,#4f8ff7,#a78bfa,#ff5c5c);
  animation:spin 6s linear infinite; box-shadow:0 0 0 3px var(--card),0 0 34px 6px #b968f0,inset 0 0 14px rgba(255,255,255,0.4);}
@keyframes spin{to{transform:rotate(360deg);}}
.hud-mid{flex:1; min-width:0;}
.hud-label{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--sub2); font-weight:700;}
.hud-score{font-size:30px; font-weight:800; letter-spacing:-.5px; line-height:1.1;}
.hud-score span{font-size:15px; color:var(--sub); font-weight:600;}
.hud-bar-track{margin-top:8px; height:8px; border-radius:6px; background:var(--card2); overflow:hidden; border:1px solid var(--line);}
.hud-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s ease;}
.hud-meta{display:flex; justify-content:space-between; margin-top:6px; font-size:11.5px; color:var(--sub);}
.hud-xptoday{margin-top:12px; display:flex; gap:8px;}
.pill{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; text-align:center;}
.pill b{display:block; font-size:16px;}
.pill span{font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.6px;}

/* ===== NAV ===== */
.tabbar{position:sticky; bottom:0; z-index:30; display:flex; background:var(--card); border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom)); gap:2px; max-width:520px; margin:0 auto; width:100%;}
.tab{flex:1; border:none; background:transparent; padding:8px 2px; border-radius:12px; font-size:10.5px; font-weight:700;
  color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; letter-spacing:.3px;}
.tab .ic{font-size:18px;}
.tab.active{color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent);}

/* ===== SECTIONS ===== */
.section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:var(--sub);
  margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:12px;}

/* Aspects */
.aspect-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.aspect-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center; cursor:pointer;
  transition:transform .15s ease, border-color .2s;}
.aspect-card:active{transform:scale(.97);}
.aspect-name{font-size:12.5px; font-weight:700; margin-top:8px;}
.aspect-sub{font-size:10.5px; color:var(--sub); margin-top:2px;}
.ring{width:64px; height:64px; margin:0 auto;}
.ring circle{fill:none; stroke-width:7;}
.ring .bg{stroke:var(--card2);}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring text{font-size:15px; font-weight:800; fill:var(--text);}

/* task list */
.task-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.task-row:last-child{border-bottom:none;}
.chk{width:23px; height:23px; border-radius:7px; border:2px solid var(--sub2); flex:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .15s;}
.chk.on{background:var(--green); border-color:var(--green); color:#08130c;}
.task-name{flex:1; font-size:14px; font-weight:600;}
.task-xp{font-size:12px; color:var(--sub); font-weight:700;}
.task-row.done .task-name{color:var(--sub); text-decoration:line-through;}

/* diet / study / practice */
.field-row{display:flex; gap:8px; margin-top:10px;}
.field-row input, .field-row textarea{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px;}
textarea{width:100%; min-height:70px; resize:vertical; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:8px;}
.btn{background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
.btn.sm{padding:7px 12px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.progress-line{display:flex; align-items:center; gap:10px; margin-top:6px;}
.progress-line .track{flex:1; height:10px; border-radius:6px; background:var(--card2); overflow:hidden;}
.progress-line .fill{height:100%; background:linear-gradient(90deg,var(--green),#8ff0b0);}
.small-muted{font-size:11.5px; color:var(--sub);}

/* calendar */
.week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.week-nav b{font-size:14px;}
.dots{display:flex; justify-content:space-between;}
.day-dot{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10px; color:var(--sub);}
.dot{width:20px; height:20px; border-radius:50%; background:var(--card2); border:2px solid var(--line);}
.dot.g{background:var(--green); border-color:var(--green);}
.dot.y{background:var(--yellow); border-color:var(--yellow);}
.dot.r{background:var(--red); border-color:var(--red);}
.dot.today{box-shadow:0 0 0 2px var(--accent);}

/* achievement bars */
.ach-row{margin-bottom:16px;}
.ach-head{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px;}
.stepper{display:flex; gap:6px;}
.step{flex:1; height:14px; border-radius:5px; background:var(--card2); border:1px solid var(--line); cursor:pointer;}
.step.on{background:var(--accent);}

/* milestones */
.milestone-grid{display:flex; flex-wrap:wrap; gap:8px;}
.ms{padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card2); font-size:12.5px; font-weight:700; cursor:pointer; flex:1 1 30%; text-align:center;}
.ms.on{background:var(--green); color:#08130c; border-color:var(--green);}

/* penalties */
.pen-active{padding:16px; border-radius:var(--radius); text-align:center; font-weight:800;}
.pen-level0{background:color-mix(in srgb,var(--green) 18%,var(--card));}
.pen-level1{background:color-mix(in srgb,var(--yellow) 20%,var(--card));}
.pen-level2,.pen-level3{background:color-mix(in srgb,#ff9a3d 22%,var(--card));}
.pen-level4,.pen-level5{background:color-mix(in srgb,var(--red) 24%,var(--card));}
.pen-list .task-row{align-items:flex-start;}
.badge{font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; background:var(--card2); color:var(--sub);}

/* settings */
.swatch-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;}
.swatch{width:34px; height:34px; border-radius:50%; border:2px solid var(--line); cursor:pointer;}
.swatch.sel{border-color:var(--text); transform:scale(1.1);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.switch{width:46px; height:26px; border-radius:20px; background:var(--card2); border:1px solid var(--line); position:relative; cursor:pointer;}
.switch.on{background:var(--accent);}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s;}
.switch.on::after{left:22px;}
.edit-task-row{display:flex; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
.edit-task-row input[type=text]{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13px;}
.edit-task-row input[type=number]{width:56px; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:7px 6px; font-size:13px; text-align:center;}
.iconbtn{background:none; border:none; color:var(--sub); font-size:16px; cursor:pointer; padding:4px 6px;}
.lockbar{display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:14px; font-size:12.5px;}
.hidden{display:none !important;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--card); border-radius:var(--radius); padding:20px; width:100%; max-width:340px;}
.modal h3{margin:0 0 10px;}
.arc-desc{font-size:12px; color:var(--sub); margin-bottom:8px;}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <div class="hud" id="hud"></div>
  <div class="scroll" id="page"></div>
  <div class="tabbar">
    <button class="tab" data-tab="home"><span class="ic">🏠</span>Home</button>
    <button class="tab" data-tab="weekly"><span class="ic">🗓️</span>Weekly/Monthly</button>
    <button class="tab" data-tab="penalties"><span class="ic">⚔️</span>Penalties</button>
    <button class="tab" data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </div>
  <button id="install-btn" class="hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:40;
    background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:30px;font-weight:800;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);">⬇ Install App</button>
</div>
<div id="modal-root"></div>

<script>
/* ============================= CONSTANTS ============================= */
const CAMPAIGN_DAYS = 231;
const TOTAL_DAILY_XP_MAX = CAMPAIGN_DAYS * 100; // 23100
const RANKS = [
  {name:'E', min:0, glow:['#5f6473','#7d8590']},
  {name:'D', min:50, glow:['#8a5a34','#c48a56']},
  {name:'C', min:60, glow:['#2f6fe0','#5f9dff']},
  {name:'B', min:70, glow:['#0fae9e','#5be0d0']},
  {name:'A', min:80, glow:['#8b3fe0','#c08bff']},
  {name:'S', min:90, glow:['#e0a80f','#ffd94d']},
  {name:'S+', min:95, glow:['splus','splus']},
];
const ACCENTS = ['#7c5cff','#ff5c8a','#3ddc84','#ffb14d','#4fd0ff','#ff5c5c','#c08bff'];

const DEFAULT_TASKS = {
  strength:{label:'Strength & Fitness', icon:'💪', max:35, tasks:[
    {id:'walk', name:'4 km walk', xp:10},
    {id:'exercise', name:'Exercise', xp:12},
    {id:'protein', name:'80g protein', xp:8},
    {id:'water', name:'Adequate water', xp:5},
  ]},
  intellect:{label:'Intellect', icon:'🧠', max:40, tasks:[
    {id:'study', name:'NEET study / practice', xp:30},
    {id:'revision', name:'Revision / questions', xp:10},
  ]},
  discipline:{label:'Discipline & Habits', icon:'🔥', max:11, tasks:[
    {id:'wake', name:'Wake at 7:00 AM', xp:8},
    {id:'review', name:'Daily completion / review', xp:3},
  ]},
  skills:{label:'Skills', icon:'✨', max:14, tasks:[
    {id:'skincare', name:'Skincare', xp:4},
    {id:'haircare', name:'Hair care', xp:3},
    {id:'shower', name:'Shower', xp:3},
    {id:'brush', name:'Brush teeth twice', xp:4},
  ]},
};

const DEFAULT_ACH = {
  weeklyTests:0, // 0-8
  arcI:0, // 0-5
  arcII:0, // 0-6
  arcIII:0, // 0-6
  milestones:[false,false,false,false,false,false], // 6, 1pt each
  driving:0, // 0-3
  bookLHN:false, // 3
  bookAH:false, // 3
};

const DEFAULT_CONFIG = {
  theme:'dark', accent:'#7c5cff', threshold:70,
  startDate: todayStr(),
  pin:'', ownerUnlocked:false,
  tasks: DEFAULT_TASKS,
};

/* ============================= UTIL ============================= */
function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function weekOf(dateStr, startDate){
  const a=new Date(startDate+'T00:00:00'), b=new Date(dateStr+'T00:00:00');
  const diff=Math.floor((b-a)/86400000);
  return Math.max(1, Math.floor(diff/7)+1);
}
function weekStartDate(startDate, weekNum){ return addDays(startDate,(weekNum-1)*7); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function rankFor(score){ let r=RANKS[0]; for(const x of RANKS){ if(score>=x.min) r=x; } return r; }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============================= STORAGE ============================= */
let config = structuredClone(DEFAULT_CONFIG);
let achievements = structuredClone(DEFAULT_ACH);
let days = {}; // dateStr -> {tasksDone:{id:true}, protein:0, studyLog:'', questions:0, leave:false}
let plans = {}; // dateStr -> text
let penaltyLog = []; // {week, level, ts}

// Storage layer: uses Claude's window.storage when this file is running inside a Claude
// artifact preview, and falls back to the browser's own localStorage when it's running as
// your own installed/hosted app (which is the normal case once you've downloaded this file).
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
async function kvGet(key){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key, true); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function kvSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, true); return; }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function loadAll(){
  try{ const c = await kvGet('ascend:config'); if(c) config = {...structuredClone(DEFAULT_CONFIG), ...JSON.parse(c)}; }catch(e){}
  try{ const a = await kvGet('ascend:achievements'); if(a) achievements = {...structuredClone(DEFAULT_ACH), ...JSON.parse(a)}; }catch(e){}
  try{ const d = await kvGet('ascend:days'); if(d) days = JSON.parse(d); }catch(e){}
  try{ const p = await kvGet('ascend:plans'); if(p) plans = JSON.parse(p); }catch(e){}
  try{ const pl = await kvGet('ascend:penaltylog'); if(pl) penaltyLog = JSON.parse(pl); }catch(e){}
}
async function saveConfig(){ await kvSet('ascend:config', JSON.stringify(config)); }
async function saveAch(){ await kvSet('ascend:achievements', JSON.stringify(achievements)); }
async function saveDays(){ await kvSet('ascend:days', JSON.stringify(days)); }
async function savePlans(){ await kvSet('ascend:plans', JSON.stringify(plans)); }
async function savePenaltyLog(){ await kvSet('ascend:penaltylog', JSON.stringify(penaltyLog)); }

function isOwner(){ return config.ownerUnlocked; }

/* ============================= SCORING ============================= */
function dayXP(dateStr){
  const rec = days[dateStr];
  if(!rec) return 0;
  let sum=0;
  for(const cat of Object.values(config.tasks)){
    for(const t of cat.tasks){ if(rec.tasksDone && rec.tasksDone[t.id]) sum += t.xp; }
  }
  return sum;
}
function totalDailyXP(){
  let sum=0;
  for(const k of Object.keys(days)){ sum += dayXP(k); }
  return sum;
}
function dailyDisciplineScore(){ return (totalDailyXP()/TOTAL_DAILY_XP_MAX)*60; }
function achievementScore(){
  return clamp(achievements.weeklyTests,0,8)+clamp(achievements.arcI,0,5)+clamp(achievements.arcII,0,6)+clamp(achievements.arcIII,0,6);
}
function milestoneScore(){
  const ms = achievements.milestones.filter(Boolean).length; // 0-6
  return ms + clamp(achievements.driving,0,3) + (achievements.bookLHN?3:0) + (achievements.bookAH?3:0);
}
function finalScore(){
  return clamp(dailyDisciplineScore()+achievementScore()+milestoneScore(), 0, 100);
}
function currentWeek(){ return clamp(weekOf(todayStr(), config.startDate),1,33); }
function currentArcLabel(){
  const w = currentWeek();
  if(w<=11) return 'Arc I — Foundation';
  if(w<=22) return 'Arc II — Evolution';
  return 'Arc III — Ascension';
}

/* ---- penalty detection ---- */
function weekMissCount(weekNum){
  const start = weekStartDate(config.startDate, weekNum);
  let misses=0;
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    if(d > todayStr()) continue; // future day, not yet failed
    const rec = days[d];
    if(rec && rec.leave) continue; // paid leave, no miss
    const xp = dayXP(d);
    if(xp < config.threshold) misses++;
  }
  return misses;
}
function penaltyForMisses(n){
  if(n<=0) return {level:0, name:'No penalty', desc:'Full privileges. Keep the streak alive.'};
  if(n===1) return {level:1, name:'P1 — Warning', desc:'No entertainment / social media for the rest of the day.'};
  if(n===2) return {level:2, name:'P2 — Lockdown', desc:'No entertainment / gaming / recreational YouTube for 24 hours.'};
  if(n===3) return {level:3, name:'P3 — Loss', desc:'Lose one planned leisure activity + no non-essential phone use until core quest is done.'};
  if(n===4) return {level:4, name:'P4 — Boss', desc:'Lose one reward coupon + full leisure restriction next day.'};
  return {level:5, name:'P5 — Hard Mode', desc:'Lose one paid-leave day + 3 days of Hard Mode.'};
}

/* ============================= RENDER: HUD ============================= */
function renderHud(){
  const score = finalScore();
  const rank = rankFor(score);
  const isSplus = rank.name==='S+';
  document.getElementById('hud').innerHTML = `
    <div class="hud-top">
      <div class="rank-core ${isSplus?'splus':''}" style="${isSplus?'':`--rank-glow:${rank.glow[0]};--rank-glow2:${rank.glow[1]}`}">
        ${rank.name}
      </div>
      <div class="hud-mid">
        <div class="hud-label">Final Campaign Score</div>
        <div class="hud-score">${score.toFixed(1)}<span>/100</span></div>
        <div class="hud-bar-track"><div class="hud-bar-fill" style="width:${score}%"></div></div>
        <div class="hud-meta"><span>${currentArcLabel()}</span><span>Week ${currentWeek()} / 33</span></div>
      </div>
    </div>
    <div class="hud-xptoday">
      <div class="pill"><b>${dayXP(todayStr())}</b><span>XP Today</span></div>
      <div class="pill"><b>${dailyDisciplineScore().toFixed(1)}/60</b><span>Discipline</span></div>
      <div class="pill"><b>${achievementScore()}/25</b><span>Achievements</span></div>
      <div class="pill"><b>${milestoneScore()}/15</b><span>Milestones</span></div>
    </div>
  `;
  document.querySelector('.rank-core').style.setProperty('--rank-glow', isSplus?'':rank.glow[0]);
}

/* ============================= RENDER: HOME ============================= */
let openAspect = null;

function ring(pct, size=64, stroke=7){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-clamp(pct,0,1));
  return `<svg class="ring" viewBox="0 0 ${size} ${size}">
    <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle">${Math.round(pct*100)}%</text>
  </svg>`;
}

function renderHome(){
  const t = todayStr();
  const rec = days[t] || {tasksDone:{}, protein:0, studyLog:'', questions:0, leave:false};
  days[t] = rec;

  const aspectsHtml = Object.entries(config.tasks).map(([key,cat])=>{
    const earned = cat.tasks.reduce((s,tk)=> s + (rec.tasksDone[tk.id]?tk.xp:0), 0);
    const pct = cat.max? earned/cat.max : 0;
    return `<div class="aspect-card" data-aspect="${key}">
      ${ring(pct)}
      <div class="aspect-name">${cat.icon} ${cat.label}</div>
      <div class="aspect-sub">${earned}/${cat.max} XP</div>
    </div>`;
  }).join('');

  let expandedHtml = '';
  if(openAspect && config.tasks[openAspect]){
    const cat = config.tasks[openAspect];
    expandedHtml = `<div class="card" id="aspect-detail">
      <div class="section-title" style="margin-top:0">${cat.icon} ${cat.label} <span class="small-muted">tap ✕ to close</span></div>
      ${cat.tasks.map(tk=>`
        <div class="task-row ${rec.tasksDone[tk.id]?'done':''}">
          <div class="chk ${rec.tasksDone[tk.id]?'on':''}" data-task="${tk.id}" data-cat="${openAspect}">${rec.tasksDone[tk.id]?'✓':''}</div>
          <div class="task-name">${tk.name}</div>
          <div class="task-xp">${tk.xp} XP</div>
        </div>`).join('')}
      <div style="text-align:right;margin-top:10px;"><button class="btn ghost sm" id="close-aspect">Close ✕</button></div>
    </div>`;
  }

  const proteinPct = clamp(rec.protein/80,0,1);
  const weekN = currentWeek();
  const wStart = weekStartDate(config.startDate, weekN);
  const dotsHtml = Array.from({length:7}).map((_,i)=>{
    const d = addDays(wStart,i);
    const dr = days[d];
    let cls='';
    if(d>t) cls='';
    else if(dr && dr.leave) cls='y';
    else if(dr) cls = dayXP(d)>=config.threshold ? 'g' : 'r';
    else cls = d<t ? 'r' : '';
    return `<div class="day-dot"><div class="dot ${cls} ${d===t?'today':''}"></div>${['S','M','T','W','T','F','S'][i]}</div>`;
  }).join('');

  document.getElementById('page').innerHTML = `
    <div class="section-title">Aspects</div>
    <div class="aspect-grid">${aspectsHtml}</div>
    ${expandedHtml}

    <div class="section-title">Diet</div>
    <div class="card">
      <div class="small-muted">Protein target: 80g</div>
      <div class="progress-line"><div class="track"><div class="fill" style="width:${proteinPct*100}%"></div></div><b>${rec.protein||0}g</b></div>
      <div class="field-row">
        <input type="number" id="protein-input" placeholder="Grams eaten so far" value="${rec.protein||''}" ${isOwner()?'':'disabled'}>
        <button class="btn sm" id="save-protein" ${isOwner()?'':'disabled'}>Log</button>
      </div>
    </div>

    <div class="section-title">Study</div>
    <div class="card">
      <div class="small-muted">What did you study today?</div>
      <textarea id="study-log" placeholder="e.g. Physics — Rotational Motion, Ch. 7" ${isOwner()?'':'disabled'}>${rec.studyLog||''}</textarea>
      <div style="text-align:right;margin-top:6px;"><button class="btn sm" id="save-study" ${isOwner()?'':'disabled'}>Save</button></div>
    </div>

    <div class="section-title">Practice</div>
    <div class="card">
      <div class="small-muted">Questions done today</div>
      <div class="field-row">
        <input type="number" id="questions-input" placeholder="No. of questions" value="${rec.questions||''}" ${isOwner()?'':'disabled'}>
        <button class="btn sm" id="save-questions" ${isOwner()?'':'disabled'}>Log</button>
      </div>
    </div>

    <div class="section-title">Tonight's Planner <span class="small-muted" style="text-transform:none;font-weight:500;">for tomorrow</span></div>
    <div class="card">
      <textarea id="planner" placeholder="Plan tomorrow's priorities before you sleep..." ${isOwner()?'':'disabled'}>${plans[addDays(t,1)]||''}</textarea>
      <div style="text-align:right;margin-top:6px;"><button class="btn sm" id="save-planner" ${isOwner()?'':'disabled'}>Save Plan</button></div>
    </div>

    <div class="section-title">Week ${weekN} Calendar</div>
    <div class="card">
      <div class="week-nav"><button class="btn ghost sm" id="week-prev">←</button><b>Week ${weekN}</b><button class="btn ghost sm" id="week-next">→</button></div>
      <div class="dots">${dotsHtml}</div>
      <div class="small-muted" style="margin-top:10px;">🟢 sufficient XP · 🟡 leave day · 🔴 insufficient XP</div>
      ${isOwner()?`<div style="text-align:right;margin-top:10px;"><button class="btn ghost sm" id="toggle-leave">${rec.leave?'Undo leave for today':'Mark today as paid leave'}</button></div>`:''}
    </div>
  `;

  document.querySelectorAll('.aspect-card').forEach(el=>{
    el.onclick = ()=>{ openAspect = openAspect===el.dataset.aspect? null : el.dataset.aspect; renderHome(); };
  });
  document.getElementById('close-aspect') && (document.getElementById('close-aspect').onclick = ()=>{ openAspect=null; renderHome(); });
  document.querySelectorAll('[data-task]').forEach(el=>{
    el.onclick = async ()=>{
      if(!isOwner()) return;
      const id = el.dataset.task;
      rec.tasksDone[id] = !rec.tasksDone[id];
      await saveDays(); renderHome(); renderHud(); checkPenaltyAutoLog();
    };
  });
  if(isOwner()){
    document.getElementById('save-protein').onclick = async ()=>{ rec.protein = Number(document.getElementById('protein-input').value)||0; await saveDays(); renderHome(); };
    document.getElementById('save-study').onclick = async ()=>{ rec.studyLog = document.getElementById('study-log').value; await saveDays(); };
    document.getElementById('save-questions').onclick = async ()=>{ rec.questions = Number(document.getElementById('questions-input').value)||0; await saveDays(); };
    document.getElementById('save-planner').onclick = async ()=>{ plans[addDays(t,1)] = document.getElementById('planner').value; await savePlans(); };
    document.getElementById('toggle-leave').onclick = async ()=>{ rec.leave = !rec.leave; await saveDays(); renderHome(); renderHud(); };
  }
  document.getElementById('week-prev').onclick = ()=>{ shiftHomeWeek(-1); };
  document.getElementById('week-next').onclick = ()=>{ shiftHomeWeek(1); };
}
let homeWeekOverride = null;
function shiftHomeWeek(dir){
  // simple: temporarily change config.startDate view by adjusting displayed week via a closure var
  homeWeekOverride = clamp((homeWeekOverride||currentWeek())+dir,1,33);
  // re-render with override by monkey patching currentWeek temporarily
  const realWeek = currentWeek;
  window.__weekOverrideActive = true;
  renderHomeWithWeek(homeWeekOverride);
}
function renderHomeWithWeek(weekN){
  // lightweight: re-render full home then patch the calendar week number/dots
  renderHome();
  const t = todayStr();
  const wStart = weekStartDate(config.startDate, weekN);
  const dotsHtml = Array.from({length:7}).map((_,i)=>{
    const d = addDays(wStart,i);
    const dr = days[d];
    let cls='';
    if(dr && dr.leave) cls='y';
    else if(dr) cls = dayXP(d)>=config.threshold ? 'g' : 'r';
    else cls = d<t ? 'r' : '';
    return `<div class="day-dot"><div class="dot ${cls} ${d===t?'today':''}"></div>${['S','M','T','W','T','F','S'][i]}</div>`;
  }).join('');
  const dotsContainer = document.querySelectorAll('.dots')[document.querySelectorAll('.dots').length-1];
  if(dotsContainer) dotsContainer.innerHTML = dotsHtml;
  const label = document.querySelectorAll('.week-nav b');
  if(label.length) label[label.length-1].textContent = `Week ${weekN}`;
}

/* ============================= RENDER: WEEKLY/MONTHLY ============================= */
function renderWeekly(){
  const arcs = [
    {key:'arcI', label:'Arc I — Foundation', weeks:'Weeks 1–11', max:5, desc:'Hardest half of NEET syllabus · learn driving · target 4kg loss.'},
    {key:'arcII', label:'Arc II — Evolution', weeks:'Weeks 12–22', max:6, desc:'Remaining syllabus · whole-syllabus revision · The Laws of Human Nature · target 4kg loss.'},
    {key:'arcIII', label:'Arc III — Ascension', weeks:'Weeks 23–33', max:6, desc:'30 tests + revision · Atomic Habits · target 3kg loss.'},
  ];
  document.getElementById('page').innerHTML = `
    <div class="section-title">Weekly NEET Tests</div>
    <div class="card">
      <div class="ach-row">
        <div class="ach-head"><span>Consistency & completion</span><span>${achievements.weeklyTests}/8</span></div>
        <div class="stepper" id="weeklyTests-stepper">${Array.from({length:8}).map((_,i)=>`<div class="step ${i<achievements.weeklyTests?'on':''}" data-v="${i+1}"></div>`).join('')}</div>
      </div>
    </div>

    <div class="section-title">The Three Arcs</div>
    <div class="card">
      ${arcs.map(a=>`
        <div class="ach-row">
          <div class="ach-head"><span>${a.label} <span class="small-muted">(${a.weeks})</span></span><span>${achievements[a.key]}/${a.max}</span></div>
          <div class="arc-desc">${a.desc}</div>
          <div class="stepper" data-key="${a.key}">${Array.from({length:a.max}).map((_,i)=>`<div class="step ${i<achievements[a.key]?'on':''}" data-v="${i+1}" data-key="${a.key}"></div>`).join('')}</div>
        </div>`).join('')}
    </div>

    <div class="section-title">Milestones <span class="small-muted" style="text-transform:none;font-weight:500;">6 total · 1 pt each</span></div>
    <div class="card">
      <div class="milestone-grid">
        ${achievements.milestones.map((on,i)=>`<div class="ms ${on?'on':''}" data-ms="${i}">Milestone ${i+1}</div>`).join('')}
      </div>
    </div>

    <div class="section-title">Driving <span class="small-muted" style="text-transform:none;font-weight:500;">3 pts</span></div>
    <div class="card">
      <div class="ach-head"><span>Driving progression</span><span>${achievements.driving}/3</span></div>
      <div class="stepper" id="driving-stepper">${Array.from({length:3}).map((_,i)=>`<div class="step ${i<achievements.driving?'on':''}" data-v="${i+1}"></div>`).join('')}</div>
    </div>

    <div class="section-title">Reading Quests</div>
    <div class="card">
      <div class="toggle-row"><span>The Laws of Human Nature <span class="small-muted">(Arc II · 3 pts)</span></span><div class="switch ${achievements.bookLHN?'on':''}" id="book-lhn"></div></div>
      <div class="toggle-row"><span>Atomic Habits <span class="small-muted">(Arc III · 3 pts)</span></span><div class="switch ${achievements.bookAH?'on':''}" id="book-ah"></div></div>
    </div>
  `;

  const bindStepper = (container, key, max)=>{
    container.querySelectorAll('.step').forEach(s=>{
      s.onclick = async ()=>{
        if(!isOwner()) return;
        const v = Number(s.dataset.v);
        achievements[key] = achievements[key]===v ? v-1 : v;
        achievements[key] = clamp(achievements[key],0,max);
        await saveAch(); renderWeekly(); renderHud();
      };

  bindStepper(document.getElementById('weeklyTests-stepper'),'weeklyTests',8);
  bindStepper(document.getElementById('driving-stepper'),'driving',3);
  document.querySelectorAll('[data-key]').forEach(s=>{

    bindStepper(s, key, max);

  document.querySelectorAll('.ms').forEach(el=>{
    el.onclick = async ()=>{
      if(!isOwner()) return;
      const i = Number(el.dataset.ms);
      achievements.milestones[i] = !achievements.milestones[i];
      await saveAch(); renderWeekly(); renderHud();
    };
  });
  document.getElementById('book-lhn').onclick = async ()=>{ if(!isOwner())return; achievements.bookLHN=!achievements.bookLHN; await saveAch(); renderWeekly(); renderHud(); };
  document.getElementById('book-ah').onclick = async ()=>{ if(!isOwner())return; achievements.bookAH=!achievements.bookAH; await saveAch(); renderWeekly(); renderHud(); };
}

/* ============================= RENDER: PENALTIES ============================= */
async function checkPenaltyAutoLog(){
  const w = currentWeek();
  const misses = weekMissCount(w);
  const pen = penaltyForMisses(misses);
  const last = penaltyLog[penaltyLog.length-1];
  if(!last || last.week!==w || last.level!==pen.level){
    penaltyLog.push({week:w, level:pen.level, name:pen.name, ts:todayStr()});
    await savePenaltyLog();
  }
}
function renderPenalties(){
  const w = currentWeek();
  const misses = weekMissCount(w);
  const pen = penaltyForMisses(misses);
  const history = penaltyLog.slice(-15).reverse();
  document.getElementById('page').innerHTML = `
    <div class="section-title">Current Status — Week ${w}</div>
    <div class="pen-active pen-level${pen.level}">
      <div style="font-size:15px;">${pen.name}</div>
      <div class="small-muted" style="margin-top:6px;font-weight:500;">${pen.desc}</div>
      <div class="small-muted" style="margin-top:10px;font-weight:500;">${misses} miss${misses===1?'':'es'} logged this week</div>
    </div>

    <div class="section-title">Penalty Ladder</div>
    <div class="card pen-list">
      ${[1,2,3,4,5].map(n=>{
        const p = penaltyForMisses(n);
        return `<div class="task-row"><span class="badge">${p.name}</span><div class="task-name" style="margin-left:10px;">${p.desc}</div></div>`;
      }).join('')}
    </div>

    <div class="section-title">Recent Auto-Log</div>
    <div class="card">
      ${history.length? history.map(h=>`<div class="task-row"><div class="task-name">Week ${h.week} — ${h.name}</div><div class="task-xp">${h.ts}</div></div>`).join('') : '<div class="small-muted">No penalties logged yet. Stay clean.</div>'}
    </div>

    <div class="section-title">Paid Leave</div>
    <div class="card">
      <div class="small-muted">7 self-chosen paid-leave days across the campaign. Mark a day as leave from the Home tab calendar — it won't count as a miss.</div>
      <div style="margin-top:10px;font-weight:700;">${Object.values(days).filter(d=>d.leave).length} / 7 used</div>
    </div>
  `;
}

/* ============================= RENDER: SETTINGS ============================= */
function renderSettings(){
  document.getElementById('page').innerHTML = `
    <div class="section-title">Access</div>
    <div class="card">
      <div class="lockbar">${isOwner() ? '🔓 Owner mode — you can edit everything.' : '🔒 View-only mode — you can watch progress but not edit it.'}</div>
      ${isOwner() ? `
        <div class="small-muted">Set / change your edit PIN so shared viewers can't edit.</div>
        <div class="field-row"><input type="text" id="pin-input" placeholder="New PIN" value=""><button class="btn sm" id="save-pin">Save PIN</button></div>
        <div style="margin-top:10px;"><button class="btn ghost sm" id="lock-btn">Lock editing (switch to view-only)</button></div>
      ` : `
        <div class="field-row"><input type="password" id="pin-try" placeholder="Enter PIN to unlock editing"><button class="btn sm" id="unlock-btn">Unlock</button></div>
        <div class="small-muted" style="margin-top:8px;">No PIN set yet? Ask the campaign owner, or if this is your first time, just tap Unlock.</div>
      `}
    </div>

    <div class="section-title">Appearance</div>
    <div class="card">
      <div class="toggle-row"><span>Dark theme</span><div class="switch ${config.theme==='dark'?'on':''}" id="theme-switch"></div></div>
      <div class="small-muted" style="margin-top:10px;">Accent colour</div>
      <div class="swatch-row">${ACCENTS.map(c=>`<div class="swatch ${config.accent===c?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div>
    </div>

    <div class="section-title">Campaign</div>
    <div class="card">
      <div class="small-muted">Campaign start date</div>
      <div class="field-row"><input type="date" id="start-date" value="${config.startDate}" ${isOwner()?'':'disabled'}></div>
      <div class="small-muted" style="margin-top:12px;">XP threshold to count a day as "sufficient" (used for calendar dots & penalties)</div>
      <div class="field-row"><input type="number" id="threshold-input" value="${config.threshold}" ${isOwner()?'':'disabled'}></div>
      ${isOwner()?'<div style="text-align:right;margin-top:8px;"><button class="btn sm" id="save-campaign">Save</button></div>':''}
    </div>

    <div class="section-title">Customize Daily Tasks <span class="small-muted" style="text-transform:none;font-weight:500;">XP auto-rebalances per aspect</span></div>
    ${Object.entries(config.tasks).map(([key,cat])=>`
      <div class="card">
        <div style="font-weight:800;margin-bottom:6px;">${cat.icon} ${cat.label} <span class="small-muted">(max ${cat.max} XP)</span></div>
        ${cat.tasks.map(tk=>`
          <div class="edit-task-row">
            <input type="text" data-editname="${key}:${tk.id}" value="${tk.name}" ${isOwner()?'':'disabled'}>
            <input type="number" data-editxp="${key}:${tk.id}" value="${tk.xp}" ${isOwner()?'':'disabled'}>
            ${isOwner()?`<button class="iconbtn" data-delete="${key}:${tk.id}">🗑️</button>`:''}
          </div>
        `).join('')}
        ${isOwner()?`<div style="text-align:right;margin-top:8px;display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn ghost sm" data-addtask="${key}">+ Add task</button>
          <button class="btn sm" data-savetask="${key}">Save & Rebalance</button>
        </div>`:''}
      </div>
    `).join('')}

    <div class="section-title">Sharing</div>
    <div class="card">
      <div class="small-muted">Share this app's link with anyone — they'll see your live progress. Without your PIN, they can't check off tasks or edit anything.</div>
    </div>
  `;

  if(isOwner()){
    document.getElementById('save-pin').onclick = async ()=>{ config.pin = document.getElementById('pin-input').value; await saveConfig(); renderSettings(); };
    document.getElementById('lock-btn').onclick = async ()=>{ config.ownerUnlocked=false; await saveConfig(); applyTheme(); renderAll(); };
    document.getElementById('save-campaign').onclick = async ()=>{
      config.startDate = document.getElementById('start-date').value || config.startDate;
      config.threshold = Number(document.getElementById('threshold-input').value)||70;
      await saveConfig(); renderAll();
    };
    document.querySelectorAll('[data-savetask]').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.dataset.savetask;
        const cat = config.tasks[key];
        const newTasks = cat.tasks.map(tk=>{
          const nameEl = document.querySelector(`[data-editname="${key}:${tk.id}"]`);
          const xpEl = document.querySelector(`[data-editxp="${key}:${tk.id}"]`);
          return {id:tk.id, name:nameEl.value||tk.name, xp:Number(xpEl.value)||1};
        });
        rebalance(newTasks, cat.max);
        cat.tasks = newTasks;
        await saveConfig(); renderSettings(); renderHud();
      };
    });
    document.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.onclick = async ()=>{
        const [key,id] = btn.dataset.delete.split(':');
        const cat = config.tasks[key];
        cat.tasks = cat.tasks.filter(t=>t.id!==id);
        rebalance(cat.tasks, cat.max);
        await saveConfig(); renderSettings(); renderHud();
      };
    });
    document.querySelectorAll('[data-addtask]').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.dataset.addtask;
        const cat = config.tasks[key];
        cat.tasks.push({id:'t_'+uid(), name:'New task', xp:5});
        rebalance(cat.tasks, cat.max);
        await saveConfig(); renderSettings(); renderHud();
      };
    });
  } else {
    document.getElementById('unlock-btn').onclick = ()=>{
      const val = document.getElementById('pin-try').value;
      if(config.pin==='' || val===config.pin){ config.ownerUnlocked=true; renderAll(); }
      else alert('Wrong PIN.');
    };
  }
  document.getElementById('theme-switch').onclick = async ()=>{
    config.theme = config.theme==='dark' ? 'light' : 'dark';
    await saveConfig(); applyTheme(); renderSettings();
  };
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = async ()=>{ config.accent = sw.dataset.c; await saveConfig(); applyTheme(); renderSettings(); renderHud(); };
  });
}
function rebalance(tasksArr, targetMax){
  const sum = tasksArr.reduce((s,t)=>s+t.xp,0);
  if(sum===0 || tasksArr.length===0) return;
  let running=0;
  tasksArr.forEach((t,i)=>{
    if(i===tasksArr.length-1){ t.xp = targetMax - running; }
    else{ t.xp = Math.max(1, Math.round(t.xp/sum*targetMax)); running += t.xp; }
  });
}

/* ============================= THEME / NAV / BOOT ============================= */
function applyTheme(){
  document.body.setAttribute('data-theme', config.theme);
  document.documentElement.style.setProperty('--accent', config.accent);
  document.documentElement.style.setProperty('--accent2', config.accent);
}
let activeTab = 'home';
function renderAll(){
  applyTheme();
  renderHud();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===activeTab));
  if(activeTab==='home') renderHome();
  else if(activeTab==='weekly') renderWeekly();
  else if(activeTab==='penalties') renderPenalties();
  else if(activeTab==='settings') renderSettings();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{ activeTab = t.dataset.tab; openAspect=null; renderAll(); };
});

/* ---- PWA install prompt ---- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  btn.classList.remove('hidden');
  btn.onclick = async ()=>{
    btn.classList.add('hidden');
    if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null; }
  };
});
window.addEventListener('appinstalled', ()=>{ document.getElementById('install-btn').classList.add('hidden'); });

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

(async function boot(){
  await loadAll();
  await checkPenaltyAutoLog();
  renderAll();
})();
</script>
